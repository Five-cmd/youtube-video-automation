name: 4x-Daily Physics Cartoon 3D Shorts Cloud Runner & Upload

on:
  schedule:
    # 4 slots/day (Bangkok Time UTC+7: 06:00, 09:00, 21:00, 23:00)
    - cron: '0 23 * * *'
    - cron: '0 2 * * *'
    - cron: '0 14 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  edit-and-upload:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 & Node 20
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg, Headless Chrome deps & Blender 4.2 LTS
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libxkbcommon0 libsm6 libxext6 libxrender-dev \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2 libxrandr2 libxfixes3 libxcomposite1 libxdamage1
          curl -sL https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz | tar -xJ
          sudo ln -s $(pwd)/blender-4.2.3-linux-x64/blender /usr/local/bin/blender

      - name: Install Python dependencies
        run: pip install -r requirements.txt numpy scipy pillow edge-tts

      - name: Run Cloud Physics Short Pipeline & YouTube Upload (4x/day)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CI: "true"
          HEADLESS: "1"
          TZ: Asia/Bangkok
        run: python process_and_upload.py --cloud

      - name: Save uploaded video history back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uploaded_history.json topics_roadmap_4days.json
          git diff --staged --quiet || (git commit -m "chore: record uploaded video in history" && git push)
