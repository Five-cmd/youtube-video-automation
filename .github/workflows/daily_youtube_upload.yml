name: Cartoon 3D Shorts - 4x Daily Auto Post

# Posts ONE approved cartoon short per run, 4 runs a day (Bangkok 06:00 / 09:00 / 21:00 / 23:00).
# Pipeline (all on GitHub's machines, nothing on the user's PC):
#   pick next approved+unposted comp from animation/queue.json -> voice + -15 LUFS mix -> Remotion/three.js render
#   -> frame-by-frame QA gate -> YouTube upload -> mark posted in queue.json.
# If no approved short is waiting, the run exits after ~1 minute without rendering or touching the YouTube API.
on:
  schedule:
    - cron: "0 21 * * *"   # render starts 04:00 BKK -> posts ~06:00 BKK
    - cron: "0 0 * * *"    # render starts 07:00 BKK -> posts ~09:00 BKK
    - cron: "0 12 * * *"   # render starts 19:00 BKK -> posts ~21:00 BKK
    - cron: "0 14 * * *"   # render starts 21:00 BKK -> posts ~23:00 BKK
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cartoon-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    defaults:
      run:
        working-directory: animation
    steps:
      - uses: actions/checkout@v4

      - name: Pick next approved short
        id: pick
        run: echo "comp=$(python3 post_queue.py next)" >> "$GITHUB_OUTPUT"

      - name: Nothing approved - stop here
        if: steps.pick.outputs.comp == ''
        run: echo "No approved, unposted short in queue.json. Nothing to do."

      - uses: actions/setup-node@v4
        if: steps.pick.outputs.comp != ''
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        if: steps.pick.outputs.comp != ''
        with:
          python-version: "3.12"

      - name: Install system + packages
        if: steps.pick.outputs.comp != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2 libxrandr2 \
            libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
          npm install --no-audit --no-fund
          pip install --quiet numpy scipy pillow edge-tts imageio-ffmpeg google-api-python-client google-auth
          bash scripts/fetch-kenney.sh public/bridge/kenney || true
          npx remotion browser ensure

      - name: Voice + score + SFX, mastered to -15 LUFS
        if: steps.pick.outputs.comp != ''
        run: python3 audio/make_short_audio.py "${{ steps.pick.outputs.comp }}"

      - name: Render picture (1080x1920) and mux audio
        if: steps.pick.outputs.comp != ''
        run: |
          C="${{ steps.pick.outputs.comp }}"
          npx remotion render src/index.ts "$C" out/picture.mp4 --codec h264 --crf 18 --gl=swangle --concurrency=2 --timeout=600000
          ffmpeg -y -i out/picture.mp4 -i "out/$C/mix.wav" -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 256k -shortest out/final.mp4

      - name: QA gate (blocks the upload on black / frozen / white frames or missing audio)
        if: steps.pick.outputs.comp != ''
        env:
          QA_STRICT: "1"
        run: python3 scripts/short_qa.py out/final.mp4 out/qa

      - name: Upload to YouTube
        if: steps.pick.outputs.comp != ''
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python3 post_queue.py upload "${{ steps.pick.outputs.comp }}"

      - name: Save queue state
        if: steps.pick.outputs.comp != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add queue.json
          git diff --staged --quiet || (git commit -m "cartoon: posted ${{ steps.pick.outputs.comp }}" && git pull --rebase && git push)

      - uses: actions/upload-artifact@v4
        if: always() && steps.pick.outputs.comp != ''
        with:
          name: posted-${{ steps.pick.outputs.comp }}-${{ github.run_number }}
          path: |
            animation/out/final.mp4
            animation/out/qa/
          retention-days: 7
