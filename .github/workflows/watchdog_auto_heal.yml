name: Watchdog - Auto Healer & Retry

# Runs automatically:
#   1. Immediately whenever "Cartoon 3D Shorts - 6x Daily Auto Post" finishes (catches failures at 0s lag!)
#   2. Every 2 hours on schedule (catches missed crons or hung runs).
# Completely autonomous: works when PC is turned off, uses ZERO AI tokens.

on:
  workflow_run:
    workflows: ["Cartoon 3D Shorts - 6x Daily Auto Post"]
    types: [completed]
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: watchdog-healer
  cancel-in-progress: false

jobs:
  watchdog:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet requests google-api-python-client google-auth
      - name: Read annotations, inspect pipeline, and auto-heal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python3 animation/watchdog_heal.py
