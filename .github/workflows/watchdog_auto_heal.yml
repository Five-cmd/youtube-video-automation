name: Watchdog - Auto Healer & Retry

# Runs automatically:
#   1. Immediately whenever "Cartoon 3D Shorts - 6x Daily Auto Post" finishes (catches failures at 0s lag!)
#   2. Every 2 hours on schedule (catches missed crons or hung runs).
# Completely autonomous: works when PC is turned off, uses ZERO AI tokens.

on:
  workflow_run:
    workflows: ["Cartoon 3D Shorts - 6x Daily Auto Post"]
    types: [completed]
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: watchdog-healer
  cancel-in-progress: false

jobs:
  watchdog:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet requests google-api-python-client google-auth
      - name: Sync YouTube state, inspect pipeline, and auto-heal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python3 - << 'EOF'
          import os, sys, json, subprocess, requests
          from datetime import datetime, timezone
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          gh_token = os.environ.get("GH_TOKEN")
          owner = os.environ.get("OWNER")
          repo = os.environ.get("REPO")
          H = {"Authorization": f"Bearer {gh_token}", "Accept": "application/vnd.github+json"}

          # 1. Load queue.json & sync with live YouTube uploads so we never double-post
          with open("animation/queue.json", "r", encoding="utf-8") as f:
              q = json.load(f)

          try:
              creds = Credentials(
                  None,
                  refresh_token=os.environ.get("YOUTUBE_REFRESH_TOKEN"),
                  token_uri="https://oauth2.googleapis.com/token",
                  client_id=os.environ.get("YOUTUBE_CLIENT_ID"),
                  client_secret=os.environ.get("YOUTUBE_CLIENT_SECRET"),
              )
              creds.refresh(Request())
              yt = build("youtube", "v3", credentials=creds)
              ch = yt.channels().list(part="contentDetails", mine=True).execute()
              up_id = ch["items"][0]["contentDetails"]["relatedPlaylists"]["uploads"]
              pl = yt.playlistItems().list(part="snippet", playlistId=up_id, maxResults=25).execute()
              yt_titles = {it["snippet"]["title"]: it["snippet"]["resourceId"]["videoId"] for it in pl.get("items", [])}
              changed = False
              for s in q.get("shorts", []):
                  if not s.get("posted") and s["title"] in yt_titles:
                      s["posted"] = True
                      s["video_id"] = yt_titles[s["title"]]
                      changed = True
                      print(f"Watchdog: Synced already-uploaded short '{s['comp']}' ({s['video_id']}) into queue.json")
              if changed:
                  with open("animation/queue.json", "w", encoding="utf-8") as f:
                      json.dump(q, f, indent=2, ensure_ascii=False)
                      f.write("\n")
                  subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
                  subprocess.run(["git", "config", "user.email", "github-actions[bot]@users.noreply.github.com"], check=True)
                  subprocess.run(["git", "add", "animation/queue.json"], check=True)
                  subprocess.run(["git", "commit", "-m", "watchdog: sync posted video_id from YouTube"], check=True)
                  subprocess.run(["git", "pull", "--rebase", "--autostash"], check=True)
                  subprocess.run(["git", "push"], check=True)
          except Exception as e:
              print(f"Watchdog: YouTube sync warning (continuing): {e}")

          unposted = [s for s in q.get("shorts", []) if s.get("approved") and not s.get("posted")]
          if not unposted:
              print("Watchdog: All approved shorts are already posted. Nothing pending.")
              sys.exit(0)

          target = unposted[0]
          print(f"Watchdog: Target unposted short is '{target['comp']}' (title: {target['title']})")

          # 2. Check recent runs of daily_youtube_upload.yml
          wf_url = f"https://api.github.com/repos/{owner}/{repo}/actions/workflows/daily_youtube_upload.yml/runs?per_page=5"
          r = requests.get(wf_url, headers=H)
          if r.status_code != 200:
              print(f"Failed to fetch runs: {r.status_code}")
              sys.exit(1)

          runs = r.json().get("workflow_runs", [])
          if not runs:
              disp = requests.post(f"https://api.github.com/repos/{owner}/{repo}/actions/workflows/daily_youtube_upload.yml/dispatches", headers=H, json={"ref": "main"})
              print(f"No runs found. Dispatched new run: {disp.status_code}")
              sys.exit(0)

          latest = runs[0]
          status = latest.get("status")
          conclusion = latest.get("conclusion")
          run_id = latest.get("id")
          created_at = datetime.fromisoformat(latest.get("created_at").replace("Z", "+00:00"))
          age_min = (datetime.now(timezone.utc) - created_at).total_seconds() / 60

          print(f"Latest run {run_id}: status={status}, conclusion={conclusion}, age={age_min:.1f} mins")

          if status == "queued" or (status == "in_progress" and age_min < 75):
              print(f"Run {run_id} is active ({status}, {age_min:.1f}m old). Watchdog standing by.")
              sys.exit(0)

          if status == "in_progress" and age_min >= 75:
              print(f"Run {run_id} hung ({age_min:.1f}m). Cancelling...")
              requests.post(f"https://api.github.com/repos/{owner}/{repo}/actions/runs/{run_id}/cancel", headers=H)

          # Try rerunning failed publish job first if all 10 renders + audio succeeded
          jobs_url = f"https://api.github.com/repos/{owner}/{repo}/actions/runs/{run_id}/jobs?per_page=30"
          jobs = requests.get(jobs_url, headers=H).json().get("jobs", [])
          pub_failed = any(j["name"] == "publish" and j["conclusion"] == "failure" for j in jobs)
          render_ok = all(j["conclusion"] == "success" for j in jobs if j["name"].startswith("render"))
          audio_ok = any(j["name"] == "audio" and j["conclusion"] == "success" for j in jobs)

          if pub_failed and render_ok and audio_ok and age_min < 240:
              rf = requests.post(f"https://api.github.com/repos/{owner}/{repo}/actions/runs/{run_id}/rerun-failed-jobs", headers=H)
              print(f"All renders+audio ok; rerunning failed publish job -> {rf.status_code}")
              if rf.status_code == 201:
                  sys.exit(0)

          # Avoid infinite tight loop if 3 failures happened in the last 30 mins
          recent_fails = [
              x for x in runs[:3]
              if x.get("conclusion") == "failure"
              and (datetime.now(timezone.utc) - datetime.fromisoformat(x["created_at"].replace("Z", "+00:00"))).total_seconds() < 1800
          ]
          if len(recent_fails) >= 3 and os.environ.get("GITHUB_EVENT_NAME") == "workflow_run":
              print("3 consecutive failures within 30 mins — waiting for next scheduled Watchdog check to avoid tight loop.")
              sys.exit(0)

          disp = requests.post(f"https://api.github.com/repos/{owner}/{repo}/actions/workflows/daily_youtube_upload.yml/dispatches", headers=H, json={"ref": "main"})
          print(f"Auto-healed by dispatching fresh run -> {disp.status_code}")
          EOF
