name: Render Cable Zoom 3D Short & Replace b1M5vSLzWkc

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-cable-zoom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install FFmpeg, OpenGL/EGL & Headless Blender 4.2 LTS
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libxkbcommon0 libsm6 libxext6 libxrender-dev libegl1 libgl1 libglu1-mesa libglvnd0 xvfb
          echo "[CLOUD] Downloading Blender 4.2 LTS Linux Portable..."
          curl -sL https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz | tar -xJ
          sudo ln -s $(pwd)/blender-4.2.3-linux-x64/blender /usr/local/bin/blender
          blender -b --version

      - name: Install Python dependencies
        run: pip install -r requirements.txt edge-tts faster-whisper google-api-python-client google-auth google-auth-oauthlib requests imageio-ffmpeg numpy pynacl

      - name: Render Blender 3D Cable Zoom & Replace b1M5vSLzWkc
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TZ: Asia/Bangkok
        run: python render_and_replace_b1M.py

      - name: Commit history back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uploaded_history.json
          git diff --staged --quiet || (git commit -m "chore: record replaced video in history" && git push)
